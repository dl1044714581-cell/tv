<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家常菜谱">
<meta name="theme-color" content="#c8402b">
<link rel="apple-touch-icon" href="cook-icon-180.png">
<link rel="manifest" href="cook-manifest.json">
<title>家常菜谱</title>
<style>
/* VOICE: 温暖、实用，像厨房墙上的点菜板
   IDEA: 饭馆点菜单 + 菜谱卡
   PICTURE: 每道菜一张插图或自家照片做封面
   COLOUR and TYPE: 暖白底、酱油棕字、辣椒红强调；系统中文字体，做菜时大字
   LAYOUT: 顶栏 → 分类 → 卡片；底部四个页签：菜谱 / 今日菜单 / 买菜 / 日记 */
:root{--bg:#fbf6ee;--card:#fff;--ink:#3a2a1e;--dim:#8a7462;--red:#c8402b;--line:#eadfce;--green:#3f7d4e;--soft:#f6ede0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1714;--card:#2a221d;--ink:#f3e9dc;--dim:#b09a86;--line:#3d322a;--soft:#33291f}}
:root[data-theme=dark]{--bg:#1d1714;--card:#2a221d;--ink:#f3e9dc;--dim:#b09a86;--line:#3d322a;--soft:#33291f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;overflow-x:clip}
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:21px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:#ffffff26;color:#fff;border:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px calc(170px + env(safe-area-inset-bottom))}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.full{width:100%}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:100px;line-height:1.5}
.search{margin:14px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:999px;min-height:38px}
.chips .act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:6px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cover{aspect-ratio:4/3;background:var(--soft) center/cover no-repeat;position:relative}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.dish .t{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:6px}
.dish b{font-size:17px;line-height:1.3}
.meta{color:var(--dim);font-size:13px}
.order{min-height:38px;font-size:15px;border-color:var(--red);color:var(--red);margin-top:auto}
.order.on{background:var(--red);color:#fff}
.empty{color:var(--dim);text-align:center;padding:36px 10px}
.hero{border-radius:16px;overflow:hidden;margin-top:14px}
h2{font-size:26px;line-height:1.2;margin:14px 0 4px}
h3{font-size:19px;margin:22px 0 8px}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ing li .amt{margin-left:auto;color:var(--dim);text-align:right;font-size:15px}
.box{width:24px;height:24px;border:2px solid var(--dim);border-radius:7px;flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.done .box{background:var(--green);border-color:var(--green)}
.done .nm{text-decoration:line-through;color:var(--dim)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{position:relative;padding:12px 0 12px 46px;border-bottom:1px solid var(--line);font-size:18px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:12px;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700}
.tbtn{margin-top:8px;min-height:38px;font-size:15px;color:var(--red);border-color:var(--red)}
label.tbtn{display:inline-flex;align-items:center;background:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
.panel h3{margin-top:0}
.mi{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi .th{width:56px;height:42px;border-radius:8px;background:var(--soft) center/cover;flex:none;position:relative;overflow:hidden}
.mi .th svg{position:absolute;inset:0;width:100%;height:100%}
.mi .t{flex:1;cursor:pointer}
.mi .x{border:0;background:none;color:var(--dim);font-size:22px;min-width:44px;padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:64px}.seg .act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seas{font-size:15px;color:var(--dim);line-height:1.8}
.big{font-size:24px;line-height:1.5;margin:18px 0 6px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.timer[hidden]{display:none}
.timer{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:9;box-shadow:0 8px 30px #0005}
.timer .tn{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.timer .lbl{flex:1;font-size:14px;overflow-wrap:anywhere}
.timer button{background:transparent;color:var(--bg);border-color:#ffffff55}
.timer.ring{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
@media(prefers-reduced-motion:reduce){.timer.ring{animation:none}.prog i{transition:none}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:58px;font-size:15px;color:var(--dim);position:relative}
nav .act{color:var(--red);font-weight:700}
nav .badge{position:absolute;top:6px;left:calc(50% + 22px);background:var(--red);color:#fff;font-size:12px;border-radius:999px;min-width:20px;height:20px;line-height:20px;padding:0 5px}
.note{font-size:13px;color:var(--dim);margin:10px 0}
.banner{background:var(--green);color:#fff;border-radius:12px;padding:10px 14px;margin:12px 0}
label.f{display:block;margin:14px 0 6px;font-weight:600}
.diary{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.diary img{width:100%;display:block;max-height:60vh;object-fit:cover}
.diary .t{padding:12px 14px}
.preview{width:100%;border-radius:12px;margin-top:10px;display:block}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
</style>
</head>
<body>
<header><button id="back" hidden>‹ 返回</button><h1 id="ttl">家常菜谱</h1></header>
<div class="wrap" id="app"></div>
<div class="timer" id="timer" hidden><div class="tn" id="tnum">00:00</div><div class="lbl" id="tlbl"></div><button id="tstop">停止</button></div>
<nav id="nav">
  <button data-v="list" class="act">菜谱</button>
  <button data-v="menu">今日菜单<span class="badge" id="badge" hidden></span></button>
  <button data-v="shop">买菜清单</button>
  <button data-v="diary">做饭日记</button>
</nav>
<script>
{
const R=[
{n:'番茄炒蛋',c:'素菜',t:10,i:[['番茄','2个'],['鸡蛋','3个'],['葱','1根'],['盐','适量'],['糖','1小勺']],s:['番茄切块，鸡蛋加少许盐打散，葱切花','热锅多放点油，倒入蛋液炒到刚凝固，盛出','锅里补一点油，下番茄中火翻炒出汁（3分钟）','加盐、糖调味，倒回鸡蛋翻匀，撒葱花出锅']},
{n:'可乐鸡翅',c:'荤菜',t:30,i:[['鸡翅中','10个'],['可乐','1罐'],['生抽','2勺'],['老抽','半勺'],['姜','3片'],['料酒','1勺']],s:['鸡翅两面各划两刀，冷水下锅加料酒、姜片焯水（3分钟），捞出洗净','锅里少许油，鸡翅煎到两面金黄','加生抽、老抽翻炒上色，倒入可乐没过鸡翅','大火烧开后转中小火炖（15分钟）','大火收汁到浓稠即可']},
{n:'红烧肉',c:'荤菜',t:80,i:[['五花肉','500克'],['冰糖','15颗'],['生抽','2勺'],['老抽','1勺'],['料酒','2勺'],['姜','4片'],['八角','2个'],['葱','2根']],s:['五花肉切麻将块，冷水下锅加料酒焯水（5分钟），捞出洗净','锅里少许油，小火放冰糖炒到枣红色','下肉块翻炒均匀上糖色','加生抽、老抽、姜、葱、八角，倒热水没过肉','大火烧开转小火慢炖（60分钟）','大火收汁，汤汁裹满肉块出锅']},
{n:'鱼香肉丝',c:'荤菜',t:25,i:[['猪里脊','250克'],['木耳','一小把'],['胡萝卜','半根'],['青椒','1个'],['郫县豆瓣酱','1勺'],['醋','2勺'],['糖','2勺'],['生抽','1勺'],['淀粉','1勺'],['蒜姜葱','适量']],s:['肉切丝，加少许盐、料酒、淀粉抓匀腌（10分钟）','调鱼香汁：醋2、糖2、生抽1、淀粉1、水3勺搅匀','热油滑炒肉丝变色盛出','下豆瓣酱和蒜姜炒出红油，放木耳、胡萝卜、青椒丝炒软','倒回肉丝，淋入鱼香汁大火翻匀出锅']},
{n:'宫保鸡丁',c:'荤菜',t:25,i:[['鸡腿肉','300克'],['花生米','一把'],['干辣椒','8个'],['花椒','一小撮'],['葱','2根'],['醋','1勺'],['糖','1勺'],['生抽','1勺'],['淀粉','1勺']],s:['鸡肉切丁，加少许盐、料酒、淀粉腌（10分钟）','调汁：醋、糖、生抽各1勺，淀粉半勺，水2勺','冷油下花生米小火炸酥捞出','留底油小火炒香干辣椒和花椒，下鸡丁炒变色','加葱段，倒料汁翻匀，最后放花生米']},
{n:'麻婆豆腐',c:'素菜',t:20,i:[['嫩豆腐','1盒'],['牛肉末','100克'],['郫县豆瓣酱','1勺'],['花椒粉','适量'],['蒜','3瓣'],['淀粉','1勺'],['葱','1根']],s:['豆腐切小块，放加盐的开水里焯一下（2分钟）捞出','热油炒肉末到酥，下豆瓣酱和蒜末炒出红油','加一碗水烧开，轻轻放入豆腐，小火煮（5分钟）','淀粉水分两次勾芡，轻推不要翻','出锅撒花椒粉和葱花']},
{n:'青椒土豆丝',c:'素菜',t:15,i:[['土豆','2个'],['青椒','1个'],['干辣椒','3个'],['醋','1勺'],['盐','适量'],['蒜','2瓣']],s:['土豆切细丝，清水泡洗两遍去淀粉，沥干','青椒切丝，蒜切片','热油下蒜片、干辣椒炒香','下土豆丝大火快炒（2分钟），沿锅边淋醋','放青椒丝、盐，翻炒半分钟出锅']},
{n:'蒜蓉西兰花',c:'素菜',t:10,i:[['西兰花','1颗'],['蒜','5瓣'],['盐','适量'],['蚝油','1勺']],s:['西兰花掰小朵，淡盐水泡（10分钟）洗净','开水加几滴油和盐，西兰花焯（1分钟）捞出','热油炒香蒜末，下西兰花大火翻炒','加盐、蚝油翻匀出锅']},
{n:'清蒸鱼',c:'鱼虾',t:25,i:[['鲈鱼','1条'],['葱','3根'],['姜','1块'],['蒸鱼豉油','3勺'],['料酒','1勺']],s:['鱼处理干净，两面划刀，抹料酒，肚子和刀口塞姜片葱段','水开后上锅大火蒸（8分钟），关火再焖（2分钟）','倒掉盘里的水，拿掉旧葱姜，铺上新葱丝姜丝','淋蒸鱼豉油，烧一勺滚油浇上去']},
{n:'糖醋排骨',c:'荤菜',t:50,i:[['小排','500克'],['冰糖','20克'],['醋','4勺'],['生抽','2勺'],['料酒','2勺'],['姜','3片'],['白芝麻','少许']],s:['排骨冷水下锅加料酒焯水（5分钟），捞出洗净','锅里少许油，排骨煎到微黄','加姜片、料酒、生抽、2勺醋，倒热水没过排骨','加冰糖，大火烧开转小火炖（30分钟）','大火收汁，再加2勺醋翻匀，撒芝麻']},
{n:'紫菜蛋花汤',c:'汤羹',t:8,i:[['紫菜','一小块'],['鸡蛋','1个'],['虾皮','一小把'],['葱','1根'],['香油','几滴'],['盐','适量']],s:['紫菜撕小块，和虾皮一起放汤碗里','鸡蛋打散','水烧开，转小火慢慢淋入蛋液，等几秒再推开','加盐，冲进汤碗，撒葱花、滴香油']},
{n:'西红柿牛腩',c:'荤菜',t:100,i:[['牛腩','500克'],['西红柿','3个'],['洋葱','半个'],['番茄酱','2勺'],['姜','3片'],['料酒','2勺'],['盐','适量']],s:['牛腩切块，冷水下锅加料酒焯水（5分钟），捞出洗净','西红柿去皮切块，洋葱切块','油炒洋葱和一半西红柿出汁，加番茄酱','放牛腩、姜，加热水没过，大火烧开转小火炖（80分钟）','放剩下的西红柿再煮（10分钟），加盐调味']},
{n:'蛋炒饭',c:'主食',t:10,i:[['剩米饭','1碗'],['鸡蛋','2个'],['葱','2根'],['火腿或青豆','适量'],['盐','适量'],['生抽','半勺']],s:['米饭用手抓散，鸡蛋打散，葱切花','热油下蛋液炒散盛出','下火腿或青豆炒一下，倒米饭大火炒到粒粒分开','倒回鸡蛋，加盐、生抽翻匀，撒葱花']},
{n:'葱油拌面',c:'主食',t:20,i:[['面条','1人份'],['小葱','8根'],['生抽','3勺'],['老抽','1勺'],['糖','1勺']],s:['小葱切段，葱白葱绿分开','冷油下葱白小火慢炸，再下葱绿，炸到焦黄（8分钟）','加生抽、老抽、糖，小火煮到冒小泡，关火','面条煮熟捞出，加两勺葱油拌匀']},
{n:'凉拌黄瓜',c:'凉菜',t:10,i:[['黄瓜','2根'],['蒜','4瓣'],['醋','2勺'],['生抽','1勺'],['糖','半勺'],['香油','几滴'],['辣椒油','适量']],s:['黄瓜拍碎切段，加少许盐腌（5分钟），倒掉出的水','蒜切末','加蒜末、醋、生抽、糖、香油、辣椒油拌匀']},
{n:'地三鲜',c:'素菜',t:25,i:[['茄子','1根'],['土豆','1个'],['青椒','1个'],['生抽','2勺'],['糖','1勺'],['淀粉','1勺'],['蒜','3瓣']],s:['茄子、土豆切滚刀块，青椒切块','调汁：生抽2、糖1、淀粉1、水3勺','土豆煎到金黄熟透盛出，茄子裹薄薄一层淀粉煎软盛出','炒香蒜末，倒回土豆、茄子和青椒','倒料汁大火翻匀出锅']},
{n:'回锅肉',c:'荤菜',t:40,i:[['带皮五花肉','300克'],['蒜苗','3根'],['郫县豆瓣酱','1勺'],['甜面酱','半勺'],['姜','3片'],['料酒','1勺']],s:['五花肉整块冷水下锅，加姜和料酒煮（20分钟），筷子能扎透','晾凉切薄片，蒜苗切段','少许油把肉片煸到微卷出油','下豆瓣酱、甜面酱炒出红油','放蒜苗翻炒到断生出锅']},
{n:'白灼虾',c:'鱼虾',t:10,i:[['鲜虾','500克'],['姜','4片'],['葱','2根'],['料酒','1勺'],['生抽','2勺'],['蒜','3瓣']],s:['虾洗净，剪掉虾须','水里放姜片、葱段、料酒烧开','下虾煮到变红弯曲（2分钟）立刻捞出','蘸汁：蒜末加生抽，淋一勺热油']},
{n:'冬瓜排骨汤',c:'汤羹',t:70,i:[['排骨','400克'],['冬瓜','500克'],['姜','4片'],['葱','1根'],['盐','适量']],s:['排骨冷水下锅焯水（5分钟），捞出洗净','排骨、姜片放锅里，加足量水，大火烧开转小火炖（45分钟）','冬瓜去皮切块放进去再煮（15分钟）','加盐调味，撒葱花']},
{n:'清炒小青菜',c:'素菜',t:5,i:[['小青菜','一把'],['蒜','3瓣'],['盐','适量']],s:['青菜洗净沥干，蒜拍碎','锅烧热多放点油，炒香蒜','下青菜大火快炒（1分钟）到变软','加盐翻匀马上出锅']},
{n:'辣椒炒肉',c:'荤菜',t:15,i:[['五花肉或前腿肉','250克'],['青椒或螺丝椒','4个'],['蒜','4瓣'],['豆豉','1小勺'],['生抽','1勺'],['老抽','半勺'],['盐','适量']],s:['肉切薄片，辣椒斜切段，蒜切片','辣椒不放油干煸到起虎皮，加少许盐盛出','少许油下肉片煸到出油微焦','加蒜片、豆豉炒香，放生抽、老抽上色','倒回辣椒大火翻炒均匀出锅']},
{n:'土豆烧牛肉',c:'荤菜',t:90,i:[['牛腩','500克'],['土豆','2个'],['胡萝卜','1根'],['姜','4片'],['八角','2个'],['生抽','2勺'],['老抽','1勺'],['料酒','2勺'],['冰糖','5颗']],s:['牛腩切块，冷水下锅加料酒焯水（5分钟），捞出洗净','少许油炒香姜片、八角，下牛腩翻炒','加生抽、老抽、冰糖炒匀上色，加热水没过牛肉','大火烧开转小火炖（60分钟）','放土豆、胡萝卜块再炖（20分钟），大火收汁']},
{n:'京酱肉丝',c:'荤菜',t:20,i:[['猪里脊','300克'],['甜面酱','2勺'],['大葱','2根'],['豆腐皮','2张'],['糖','1勺'],['淀粉','1勺'],['料酒','1勺']],s:['肉切丝，加料酒、淀粉、少许油抓匀腌（10分钟）','大葱葱白切细丝铺盘底，豆腐皮切方块蒸一下','热油滑炒肉丝变白盛出','少许油小火炒甜面酱加糖和一点水，炒到冒泡','倒回肉丝裹满酱汁，盛在葱丝上，用豆腐皮卷着吃']},
{n:'水煮肉片',c:'荤菜',t:25,i:[['猪里脊','300克'],['豆芽或生菜','一把'],['郫县豆瓣酱','2勺'],['干辣椒','10个'],['花椒','一小把'],['蒜','5瓣'],['淀粉','1勺'],['蛋清','1个']],s:['肉切薄片，加盐、蛋清、淀粉抓匀腌（10分钟）','豆芽焯熟铺碗底','油炒豆瓣酱和蒜末出红油，加一碗半水烧开','肉片一片片下锅，变色就关火，连汤倒在豆芽上','面上放蒜末、干辣椒段、花椒，浇一勺滚油']},
{n:'青椒肉丝',c:'荤菜',t:15,i:[['猪里脊','200克'],['青椒','3个'],['生抽','1勺'],['淀粉','1勺'],['料酒','1勺'],['盐','适量'],['蒜','2瓣']],s:['肉切丝，加料酒、生抽、淀粉抓匀腌（10分钟）','青椒切丝，蒜切末','热油滑炒肉丝变色盛出','炒香蒜末，下青椒丝大火炒到断生','倒回肉丝，加盐翻匀出锅']},
{n:'黄焖鸡',c:'荤菜',t:40,i:[['鸡腿','3个'],['干香菇','6朵'],['青椒','1个'],['土豆','1个'],['姜','4片'],['冰糖','5颗'],['生抽','2勺'],['老抽','1勺'],['蚝油','1勺']],s:['鸡腿剁块，香菇泡发，土豆切块','少许油小火炒化冰糖，下鸡块翻炒上色','加姜片、香菇翻炒，放生抽、老抽、蚝油','加热水没过鸡块，放土豆，小火焖（25分钟）','放青椒块，大火收汁到浓稠']},
{n:'三杯鸡',c:'荤菜',t:30,i:[['鸡腿','3个'],['九层塔或罗勒','一把'],['姜','一块'],['蒜','10瓣'],['米酒','1小碗'],['生抽','3勺'],['麻油','3勺'],['冰糖','5颗']],s:['鸡腿剁块，姜切片，蒜去皮整颗','麻油小火煸香姜片和蒜，下鸡块煎到表面金黄','加冰糖、生抽、米酒，大火烧开','转小火焖（15分钟），中途翻一下','大火收汁，关火前放九层塔翻匀']},

{n:'蚝油牛肉',c:'荤菜',t:20,i:[['牛里脊','250克'],['蚝油','2勺'],['生抽','1勺'],['淀粉','1勺'],['姜','3片'],['葱','2根'],['小苏打','一小撮']],s:['牛肉逆纹切片，加生抽、小苏打、淀粉、一点水抓匀腌（15分钟）','腌好后加一勺油拌匀防粘','热锅多放油，牛肉滑炒到八成熟盛出','炒香姜葱，加蚝油和少许水煮开','倒回牛肉快速翻匀出锅']},
{n:'糖醋里脊',c:'荤菜',t:30,i:[['猪里脊','300克'],['鸡蛋','1个'],['淀粉','4勺'],['番茄酱','3勺'],['白醋','2勺'],['糖','3勺'],['白芝麻','少许']],s:['里脊切条，加盐、料酒腌（10分钟）','加蛋液和淀粉抓匀挂糊','油六成热下肉条炸到定型捞出，油再烧热复炸（1分钟）到金黄','另起锅，番茄酱、糖、白醋加少许水小火熬稠','倒入肉条快速裹匀，撒芝麻']},
{n:'木须肉',c:'荤菜',t:20,i:[['猪里脊','150克'],['鸡蛋','3个'],['木耳','一把'],['黄瓜','1根'],['生抽','1勺'],['淀粉','1勺'],['葱姜','适量']],s:['肉切片加淀粉、生抽腌（10分钟），木耳泡发，黄瓜切片','鸡蛋炒散盛出','热油炒肉片变色，加葱姜','放木耳、黄瓜翻炒','倒回鸡蛋，加盐、生抽翻匀出锅']},
{n:'香菇滑鸡',c:'荤菜',t:35,i:[['鸡腿','2个'],['干香菇','8朵'],['生抽','2勺'],['蚝油','1勺'],['淀粉','1勺'],['姜','4片'],['葱','2根']],s:['鸡腿去骨切块，加生抽、蚝油、淀粉、姜丝腌（15分钟）','香菇泡发切片，和鸡块拌在一起铺盘里','水开后上锅大火蒸（15分钟）','出锅撒葱花，淋一勺热油']},
{n:'咖喱鸡',c:'荤菜',t:40,i:[['鸡腿或鸡胸','400克'],['咖喱块','3块'],['土豆','2个'],['胡萝卜','1根'],['洋葱','1个']],s:['鸡肉、土豆、胡萝卜、洋葱都切块','少许油炒香洋葱，下鸡块炒变色','放土豆、胡萝卜翻炒，加水没过食材','大火烧开转小火煮（20分钟）','关火放咖喱块搅匀化开，再开小火煮到浓稠（5分钟）']},
{n:'蒜苔炒肉',c:'荤菜',t:15,i:[['猪肉','200克'],['蒜苔','一把'],['生抽','1勺'],['淀粉','1勺'],['盐','适量'],['干辣椒','3个']],s:['肉切丝加生抽、淀粉腌（10分钟），蒜苔切段','热油炒肉丝变色盛出','下蒜苔和干辣椒炒（3分钟）到变软','倒回肉丝，加盐翻匀出锅']},

let dbp=null;
function db(){if(!dbp)dbp=new Promise((ok,no)=>{const r=indexedDB.open('ckdb',1);r.onupgradeneeded=()=>{r.result.createObjectStore('covers');r.result.createObjectStore('diary',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return dbp}
async function idb(storeName,mode,fn){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(storeName,mode);const s=t.objectStore(storeName);const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
async function loadImages(){try{
  const d=await db();
  await new Promise(ok=>{const t=d.transaction('covers');const s=t.objectStore('covers');s.openCursor().onsuccess=e=>{const c=e.target.result;if(c){covers[c.key]=c.value;c.continue()}};t.oncomplete=ok;t.onerror=ok});
  diary=(await idb('diary','readonly',s=>s.getAll()))||[];diary.sort((a,b)=>b.id-a.id);render();
}catch(e){}}
function shrink(file,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.82))};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}

function genMenu(){
  const n=people<=2?2:people<=4?3:people<=6?4:5,soup=people>=3?1:0,meatN=Math.ceil((n-soup)/2),vegN=n-soup-meatN;
  const fit={};if(pantry.length||pantryExtra.trim())canCook().forEach(x=>{fit[x.r.n]=x.miss.length===0?3:x.miss.length===1?1.2:0});
  const score=r=>Math.random()*2+(fit[r.n]||0)+(favs.includes(r.n)?1:0)+(inMenu(r.n)?-5:0);
  const pick=(pool,k)=>pool.map(r=>[score(r),r]).sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>x[1]);
  const A=all();
  sug=[...pick(A.filter(r=>r.c==='荤菜'||r.c==='鱼虾'),meatN),...pick(A.filter(r=>r.c==='素菜'||r.c==='凉菜'),vegN),...pick(A.filter(r=>r.c==='汤羹'),soup)];
}

  </div>
  ${items.length?`
  <div class="panel"><h3>几个人吃</h3><div style="display:flex;align-items:center;gap:10px"><span style="font-size:28px;font-weight:700;color:var(--red);flex:1">${people} 人<span class="meta" style="font-weight:400"> · 用量×${xOf(people)}</span></span><button id="pMinus" style="border-radius:50%;width:44px;padding:0">−</button><button id="pPlus" style="border-radius:50%;width:44px;padding:0">＋</button></div><p class="note">来客人就加人数，下面要买的用量会跟着变。菜谱原量约 2～3 人份。</p></div>
  <div class="panel"><h3>需要买的材料</h3><ul class="ing">${m.main.map(([n,a])=>`<li style="cursor:default"><span class="nm">${esc(n)}</span><span class="amt">${a.map(esc).join('<br>')}</span></li>`).join('')}</ul>
   <p class="seas"><b>调料</b>（看看家里够不够）：${m.seas.map(esc).join('、')}</p>
   <button class="pri full" id="mShop">全部加到买菜清单</button></div>
  <div class="panel"><h3>开始做</h3><button class="pri full" id="cookGo">▶ 一步一步带我做</button><p class="note">按"先做费时的"排好顺序，一屏一步，字大，要等的步骤能直接计时。</p>
   <label class="filebtn pri full" style="margin-top:6px;border-radius:12px;min-height:44px;background:var(--green);color:#fff">📷 做好了，拍照记到日记<input type="file" accept="image/*" id="doneIn"></label></div>`:''}
  <div class="panel"><h3>让家人或客人点菜</h3>
   <label class="f" for="meIn">点菜人（用这台手机点菜的人）</label><input id="meIn" value="${esc(me)}" placeholder="比如：女儿、王阿姨">
   <div class="row"><button id="shareLink">把点菜链接发给别人</button>${items.length?'<button id="sendOrder">把我点的菜发给做饭的人</button>':''}</div>
   <label class="f" for="pasteIn">收到别人发来的点菜单？粘贴到这里</label><textarea id="pasteIn" placeholder="长按粘贴，比如：【点菜单】来自：王阿姨 1. 红烧肉 2. 清蒸鱼"></textarea>
   <button class="full" id="pasteGo" style="margin-top:8px">加入今日菜单</button>
   <p class="note" id="shMsg">客人不用装 App：用微信打开链接就能点菜，点完按"把我点的菜发给做饭的人"发回给你。</p></div>
  ${items.length?'<div class="row"><button id="clrMenu">清空今日菜单</button></div>':''}`;
  setTimeout(()=>{banner=''},5000);
  $('#meIn').onchange=e=>{me=e.target.value.trim();save()};
  $('#shareLink').onclick=()=>share('来帮我点菜吧！打开链接，在想吃的菜上点"＋ 点菜"，点完去"今日菜单"按"把我点的菜发给做饭的人"：\n'+appUrl());
  if($('#sendOrder'))$('#sendOrder').onclick=()=>{me=$('#meIn').value.trim();save();share(orderText())};
  $('#pasteGo').onclick=()=>{const n=importOrder($('#pasteIn').value);$('#shMsg').textContent=n?`加入了 ${n} 道菜`:'没认出菜名，请粘贴完整的点菜单';if(n){banner=`收到 ${n} 道菜，已加入今日菜单`;render()}};
  if(items.length){
    $('#mShop').onclick=()=>{menu.items.forEach(it=>{const r=byName(it.n);if(r)addShop(r,xOf(people))});$('#mShop').textContent='已加入买菜清单 ✓'};
    $('#cookGo').onclick=startCook;
    $('#doneIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{newPhoto=await shrink(f,1280);sub('newdiary','记到日记')}catch(err){alertBox('照片读取失败，换一张试试')}};
    $('#clrMenu').onclick=e=>{const b=e.target;if(b.dataset.c){menu.items=[];save();render()}else{b.dataset.c=1;b.textContent='再点一次确认清空'}};
  }
}
function appUrl(){return location.href.split('#')[0].split('?')[0]}
function orderText(){return `【点菜单】来自：${me||'家人'}\n${menu.items.map((it,j)=>`${j+1}. ${it.n}`).join('\n')}\n（在"家常菜谱"的今日菜单里粘贴即可）\n${appUrl()}?order=${encodeURIComponent(menu.items.map(i=>i.n).join('|'))}&by=${encodeURIComponent(me||'')}`}
async function share(text){
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);$('#shMsg').textContent='已复制，去微信粘贴发送'}catch(e){$('#pasteIn').value=text;$('#shMsg').textContent='请长按上面框里的文字复制，再发到微信'}
}
function importOrder(t){
  if(!t)return 0;const by=(t.match(/来自[:：]\s*([^\s\n]+)/)||[])[1]||'';
  const names=all().map(r=>r.n).sort((a,b)=>b.length-a.length);let rest=t.split('http')[0],n=0;
  for(const nm of names){if(rest.includes(nm)){rest=rest.split(nm).join('');if(!inMenu(nm)){menu.items.push({n:nm,by});n++}}}
  save();return n;
}
function startCook(){
  const ds=menu.items.map(it=>byName(it.n)).filter(Boolean).sort((a,b)=>(b.t||0)-(a.t||0));
  if(!ds.length)return;ck={ds,d:0,s:0,showIng:true};sub('cook','跟着做');
}
function cookView(){
  const {ds,d,s}=ck,r=ds[d],tot=ds.reduce((a,x)=>a+x.s.length,0),done=ds.slice(0,d).reduce((a,x)=>a+x.s.length,0)+s;
  if(d>=ds.length){$('#app').innerHTML=`<h2>全部做完了！</h2><p>辛苦啦，开饭 🍚</p><label class="filebtn pri full" style="border-radius:12px;min-height:52px;background:var(--green);color:#fff">📷 拍照记到日记<input type="file" accept="image/*" id="doneIn2"></label><div class="row"><button class="full" id="ckBack">回到今日菜单</button></div>`;
    $('#doneIn2').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{newPhoto=await shrink(f,1280);view='newdiary';$('#ttl').textContent='记到日记';render()}catch(err){}};
    $('#ckBack').onclick=()=>setNav('menu');return}
  const step=r.s[s],m=mins(step);
  $('#app').innerHTML=`<div class="prog"><i style="width:${Math.round(done/tot*100)}%"></i></div>
  <div class="meta">第 ${d+1} 道 / 共 ${ds.length} 道 · 总进度 ${done}/${tot}</div>
  <div class="mi" style="border:0">${coverHtml(r,'th')}<div class="t"><b style="font-size:20px">${esc(r.n)}</b><div class="meta">第 ${s+1} 步 / 共 ${r.s.length} 步</div></div></div>
  ${s===0?`<details ${ck.showIng?'open':''} class="panel" id="ingBox"><summary><b>这道菜要备的料</b></summary><ul class="ing">${r.i.map(x=>`<li style="cursor:default"><span class="nm">${esc(x[0])}</span><span class="amt">${esc(scale(x[1],xOf(people)))}</span></li>`).join('')}</ul></details>`:''}
  <div class="big">${esc(step)}</div>${stepVis(r,s,step)}
  ${m?`<button class="tbtn" data-m="${m}" data-l="${esc(r.n)} · 第${s+1}步" style="min-height:48px;font-size:17px">⏱ 计时 ${m} 分钟</button>`:''}
  <div class="row" style="margin-top:24px"><button id="pv" ${d===0&&s===0?'disabled':''} style="flex:1">‹ 上一步</button><button class="pri" id="nx" style="flex:2;min-height:56px;font-size:19px">${s===r.s.length-1?(d===ds.length-1?'做完了 ✓':'这道好了，下一道 ›'):'下一步 ›'}</button></div>
  <div class="row"><button id="wakeBtn">${wake?'屏幕常亮：开':'做菜时屏幕常亮'}</button></div>`;
  $('#nx').onclick=()=>{if(s<r.s.length-1)ck.s++;else{ck.d++;ck.s=0}render();scrollTo(0,0)};
  $('#pv').onclick=()=>{if(s>0)ck.s--;else if(d>0){ck.d--;ck.s=ds[ck.d].s.length-1}render()};
  $('#wakeBtn').onclick=toggleWake;
  if(!wake&&'wakeLock' in navigator&&!ck.triedWake){ck.triedWake=1;toggleWake()}
}
function shopView(){
  $('#app').innerHTML=shop.length?`<h3>要买的东西（买到了点一下划掉）</h3><ul class="ing">${shop.map((x,i)=>`<li data-s="${i}" class="${x.d?'done':''}"><span class="box">${x.d?'✓':''}</span><span class="nm">${esc(x.n)}</span><span class="amt">${esc(x.a)}</span></li>`).join('')}</ul>
    <div class="row"><button id="clrDone">清掉已买的</button><button id="clrAll">全部清空</button><button id="copyShop">发给家人去买</button></div><p class="note" id="shMsg">调料没有列进来，记得看看家里够不够。</p>`
    :'<p class="empty">清单是空的。<br>在"今日菜单"里点"全部加到买菜清单"，或者打开一道菜加入。</p><p class="note" id="shMsg"></p>';
}
function diaryView(){
  $('#app').innerHTML=`${banner?`<div class="banner">${esc(banner)}</div>`:''}<div class="row"><label class="filebtn pri full" style="border-radius:12px;min-height:48px">📷 拍照记一顿饭<input type="file" accept="image/*" id="dIn"></label></div>
  ${diary.length?diary.map(e=>`<div class="diary">${e.photo?`<img src="${e.photo}" alt="${esc(e.dishes.join('、'))}">`:''}<div class="t"><b>${esc(e.date)}</b><div>${esc(e.dishes.join('、')||'')}</div>${e.who?`<div class="meta">点菜：${esc(e.who)}</div>`:''}${e.note?`<p style="margin:6px 0 0">${esc(e.note)}</p>`:''}
   <div class="row"><button data-share="${e.id}">分享</button>${e.dishes.length===1&&e.photo?`<button data-cv="${e.id}">设为「${esc(e.dishes[0])}」封面</button>`:''}<button data-dd="${e.id}">删除</button></div></div></div>`).join('')
   :'<p class="empty">还没有记录。做完饭拍张照，记下这顿吃了什么。</p>'}
  <p class="note">照片只存在这台手机里，换手机或清理浏览器数据会丢失，重要的照片记得另外保存。</p>`;setTimeout(()=>{banner=''},5000);
  $('#dIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{newPhoto=await shrink(f,1280);sub('newdiary','记到日记')}catch(err){}};
}
function newDiary(){
  const pre=menu.items.map(i=>i.n).join('、'),who=[...new Set(menu.items.map(i=>i.by).filter(Boolean))].join('、');
  $('#app').innerHTML=`${newPhoto?`<img class="preview" src="${newPhoto}" alt="">`:''}
  <label class="f" for="dDate">日期</label><input id="dDate" type="date" value="${today()}">
  <label class="f" for="dDish">做了哪些菜（用顿号隔开）</label><input id="dDish" value="${esc(pre)}">
  <label class="f" for="dWho">谁点的 / 谁来吃饭</label><input id="dWho" value="${esc(who)}">
  <label class="f" for="dNote">记几句</label><textarea id="dNote" placeholder="比如：客人说红烧肉好吃，下次糖少放一点"></textarea>
  ${menu.items.length?'<label class="small" style="display:flex;gap:10px;align-items:center;margin-top:12px"><input type="checkbox" id="dClr" checked style="width:22px;height:22px">保存后清空今日菜单</label>':''}
  <div class="row"><button class="pri" id="dSave" style="flex:1">保存到日记</button></div>`;
  $('#dSave').onclick=async()=>{const e={id:Date.now(),date:$('#dDate').value||today(),dishes:$('#dDish').value.split(/[、,，\s]+/).filter(Boolean),who:$('#dWho').value.trim(),note:$('#dNote').value.trim(),photo:newPhoto};
    try{await idb('diary','readwrite',s=>s.put(e));diary.unshift(e);if($('#dClr')&&$('#dClr').checked){menu.items=[];save()}newPhoto='';banner='已记到日记 ✓';setNav('diary')}catch(err){$('#dSave').textContent='保存失败，手机空间可能不够'}};
}
function editForm(){
  const r=cur&&cur.mine&&view==='edit'&&$('#ttl').textContent==='修改菜谱'?cur:{n:'',c:'荤菜',t:'',i:[],s:[]};
  $('#app').innerHTML=`<form id="ef"><label class="f" for="en">菜名</label><input id="en" required value="${esc(r.n)}" placeholder="比如：妈妈的红烧鱼">
  <label class="f" for="ec">分类</label><select id="ec">${CATS.slice(3,9).map(c=>`<option ${c===r.c?'selected':''}>${c}</option>`).join('')}</select>
  <label class="f" for="et">大约多少分钟</label><input id="et" type="number" inputmode="numeric" value="${esc(r.t)}">
  <label class="f" for="ei">食材（一行一样，名称和用量中间空一格）</label><textarea id="ei" placeholder="鸡蛋 3个&#10;番茄 2个">${esc(r.i.map(x=>x.join(' ')).join('\n'))}</textarea>
  <p class="note">不想打字：点键盘上的 🎤 话筒直接说，手机会自动转成文字；也可以从别处复制粘贴过来。</p><label class="f" for="es">步骤（一行一步；要计时就写"（10分钟）"）</label><textarea id="es" style="min-height:160px" placeholder="番茄切块&#10;小火炖（10分钟）">${esc(r.s.join('\n'))}</textarea>
  <div class="row"><button class="pri" type="submit">保存</button></div><p class="note" id="emsg"></p></form>`;
  $('#ef').onsubmit=e=>{e.preventDefault();const n=$('#en').value.trim();if(!n)return;
    if(n!==r.n&&all().some(x=>x.n===n)){$('#emsg').textContent='已经有同名的菜了，换个名字吧';return}
    const rec={n,c:$('#ec').value,t:+$('#et').value||0,i:$('#ei').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s+/);return [p[0],p.slice(1).join(' ')||'适量']}),s:$('#es').value.split('\n').map(l=>l.trim().replace(/\((\d+)分钟\)/,'（$1分钟）')).filter(Boolean)};
    if(r.n){mine=mine.map(x=>x.n===r.n?rec:x);favs=favs.map(x=>x===r.n?n:x)}else mine.unshift(rec);
    save();cur=byName(n);view='detail';$('#ttl').textContent=n;render()};
}
function startTimer(m,label){
  clearInterval(tm);const T=$('#timer');T.hidden=false;T.classList.remove('ring');$('#tlbl').textContent=label;
  const end=Date.now()+m*60000;const tick=()=>{const left=Math.max(0,Math.round((end-Date.now())/1000));$('#tnum').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left){clearInterval(tm);T.classList.add('ring');$('#tlbl').textContent='时间到！'+label;beep()}};
  tick();tm=setInterval(tick,500);
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let k=0;k<6;k++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+k*0.5;g.gain.setValueAtTime(0.3,t0);g.gain.setValueAtTime(0,t0+0.25);o.start(t0);o.stop(t0+0.3)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,200,300])}catch(e){}}
async function toggleWake(){
  const b=$('#wakeBtn');
  try{if(wake){await wake.release();wake=null}else if('wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}else{if(b)b.textContent='这台手机不支持常亮';return}}catch(e){if(b)b.textContent='常亮没能开启';return}
  if($('#wakeBtn'))$('#wakeBtn').textContent=wake?'屏幕常亮：开':'做菜时屏幕常亮';
}
async function dataUrlToFile(u,name){const r=await fetch(u);const b=await r.blob();return new File([b],name,{type:'image/jpeg'})}

$('#app').addEventListener('click',async e=>{
  const o=e.target.closest('[data-o]');if(o){e.stopPropagation();const n=o.dataset.o;if(inMenu(n))menu.items=menu.items.filter(x=>x.n!==n);else menu.items.push({n,by:me});save();render();return}
  const f=e.target.closest('[data-f]');if(f){const n=f.dataset.f;favs=favs.includes(n)?favs.filter(x=>x!==n):[n,...favs];save();render();return}
  const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render();return}
  const card=e.target.closest('.dish');if(card){open(card.dataset.n);return}
  const op=e.target.closest('[data-open]');if(op){open(op.dataset.open);return}
  const rm=e.target.closest('[data-rm]');if(rm){menu.items.splice(+rm.dataset.rm,1);save();render();return}
  const li=e.target.closest('li[data-k]');if(li&&view==='detail'){checked[li.dataset.k]=!checked[li.dataset.k];render();return}
  const t=e.target.closest('.tbtn');if(t){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(err){}startTimer(+t.dataset.m,t.dataset.l);return}
  const s=e.target.closest('li[data-s]');if(s){const x=shop[+s.dataset.s];x.d=x.d?0:1;save();render();return}
  const sh=e.target.closest('[data-share]');if(sh){const en=diary.find(x=>x.id==sh.dataset.share);const text=`${en.date} 做了：${en.dishes.join('、')}${en.note?'\n'+en.note:''}`;
    try{if(en.photo&&navigator.canShare){const file=await dataUrlToFile(en.photo,'饭菜.jpg');if(navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}}if(navigator.share){await navigator.share({text});return}}catch(err){if(err&&err.name==='AbortError')return}
    sh.textContent='这台手机不支持直接分享，可长按照片保存';return}
  const cv=e.target.closest('[data-cv]');if(cv){const en=diary.find(x=>x.id==cv.dataset.cv);try{const small=await new Promise(ok=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const cc=document.createElement('canvas');cc.width=im.width*k;cc.height=im.height*k;cc.getContext('2d').drawImage(im,0,0,cc.width,cc.height);ok(cc.toDataURL('image/jpeg',0.82))};im.src=en.photo});covers[en.dishes[0]]=small;await idb('covers','readwrite',st=>st.put(small,en.dishes[0]));cv.textContent='已设为封面 ✓'}catch(err){}return}
  const dd=e.target.closest('[data-dd]');if(dd){if(dd.dataset.c){const id=+dd.dataset.dd;try{await idb('diary','readwrite',st=>st.delete(id))}catch(err){}diary=diary.filter(x=>x.id!==id);render()}else{dd.dataset.c=1;dd.textContent='再点一次确认删除'}return}
  if(e.target.id==='clrDone'){shop=shop.filter(x=>!x.d);save();render()}
  if(e.target.id==='clrAll'){const b=e.target;if(b.dataset.c){shop=[];save();render()}else{b.dataset.c=1;b.textContent='再点一次确认'}}
  if(e.target.id==='copyShop'){const txt='【买菜清单】\n'+shop.filter(x=>!x.d).map(x=>'· '+x.n+' '+x.a).join('\n');share(txt)}
  if(e.target.id==='addNew'){cur=null;sub('edit','添加菜谱')}
  const idt=e.target.closest('button')&&e.target.closest('button').id;
  if(idt==='fridgeGo'){sub('fridge','家里有什么');return}
  if(idt==='favGo'){cat='收藏';render();return}
  if(idt==='pMinus'||idt==='pPlus'){people=Math.min(20,Math.max(1,people+(idt==='pPlus'?1:-1)));save();if(sug)genMenu();render();return}
  if(idt==='genGo'||idt==='genAgain'){genMenu();render();return}
  if(idt==='genTake'){sug.forEach(r=>{if(!inMenu(r.n))menu.items.push({n:r.n,by:me})});save();sug=null;banner='已加入今日菜单';setNav('menu');return}
  const pb=e.target.closest('[data-p]');if(pb){const l=pb.dataset.p;pantry=pantry.includes(l)?pantry.filter(x=>x!==l):[...pantry,l];store.set('ck_pantry',pantry);const y=scrollY;render();scrollTo(0,y);return}
});
$('#tstop').onclick=()=>{clearInterval(tm);$('#timer').hidden=true};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)setNav(b.dataset.v)};
$('#back').onclick=()=>{if(view==='edit'&&cur&&cur.mine&&$('#ttl').textContent==='修改菜谱'){view='detail';$('#ttl').textContent=cur.n;render()}else setNav(prev)};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&$('#wakeBtn')&&$('#wakeBtn').textContent.includes('：开')&&!wake){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});
/* 从点菜链接打开 */
try{const p=new URLSearchParams(location.search);const o=p.get('order');if(o){const by=p.get('by')||'';let n=0;o.split('|').forEach(nm=>{if(byName(nm)&&!inMenu(nm)){menu.items.push({n:nm,by});n++}});save();banner=n?`收到${by?by+'点的':''} ${n} 道菜，已加入今日菜单`:'';history.replaceState(null,'',appUrl());if(n){view='menu';prev='menu';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('act',b.dataset.v==='menu'));$('#ttl').textContent='今日菜单'}}}catch(e){}
render();loadImages();
}
</script>
</body>
</html>
